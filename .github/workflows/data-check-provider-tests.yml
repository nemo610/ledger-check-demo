name: Data Check provider tests

on:
  push:
    branches: [agentbazaar-integration-v1]
  pull_request:
    branches: [main]

jobs:
  provider-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run provider unit tests
        run: python -m unittest discover -s tests -p "test_provider_service.py" -v
